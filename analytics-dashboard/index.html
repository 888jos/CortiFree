<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CortiFree Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div>
          <div class="brand-name">CortiFree</div>
          <div class="brand-sub">Analytics en direct</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#overview" data-page="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Vue d'ensemble</a>
        <a href="#onboarding" data-page="onboarding">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>
          Onboarding</a>
        <a href="#icp" data-page="icp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          Profil ICP</a>
        <a href="#monetization" data-page="monetization">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6.5c0-1.9-2.2-3.5-5-3.5s-5 1.6-5 3.5 2.2 3.2 5 3.5 5 1.6 5 3.5-2.2 3.5-5 3.5-5-1.6-5-3.5"/></svg>
          Monétisation</a>
        <a href="#engagement" data-page="engagement">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          Engagement &amp; rétention</a>
        <a href="#notifications" data-page="notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          Notifications</a>
        <a href="#explorer" data-page="explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          Explorateur d'événements</a>
      </nav>
      <div class="sources" id="sources"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title" id="page-title">Vue d'ensemble</h1>
          <div class="page-sub" id="page-sub"></div>
        </div>
        <div class="spacer"></div>
        <div class="segmented" id="range-buttons">
          <button data-preset="today">Aujourd'hui</button>
          <button data-preset="7d">7 j</button>
          <button data-preset="30d">30 j</button>
          <button data-preset="90d">90 j</button>
          <button data-preset="custom">Perso</button>
        </div>
        <div class="custom-range" id="custom-range">
          <input type="date" id="custom-start" aria-label="Début">
          <span class="muted">→</span>
          <input type="date" id="custom-end" aria-label="Fin">
        </div>
        <button class="btn" id="refresh" title="Recharger depuis les API (ignore le cache de 5 min)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
          Actualiser</button>
        <span class="updated" id="updated"></span>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
